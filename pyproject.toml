[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cospadi-research"
version = "0.1.0"
description = "Official CoSpaDi release: calibration-guided sparse dictionary compression"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.9.1+cu128",
  "numpy==2.4.6",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "transformers==4.55.4",
  "datasets==3.6.0",
  "accelerate==1.7.0",
  "safetensors==0.5.3",
  "sentencepiece==0.2.1",
  "tqdm==4.67.1",
  "scipy==1.16.3",
  "dill==0.3.8",
  "pyarrow==22.0.0",
]

[project.optional-dependencies]
eval = ["lm-eval==0.4.8", "rouge-score>=0.1.2"]
tensorboard = ["tensorboard>=2.16"]
clearml = ["clearml>=1.16"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
cospadi-run = "paperflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paperflow"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "paperflow/configs"

[tool.hatch.build.targets.sdist]
include = ["assets", "paperflow", "configs", "tests", ".github", ".gitignore", ".python-version", "pyproject.toml", "uv.lock", "README.md", "docs", "CITATION.cff", "setup.sh", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv]
package = true
# Dependency pins for the CoSpaDi environment.
# uv sync --locked uses the pinned dependency resolution.
