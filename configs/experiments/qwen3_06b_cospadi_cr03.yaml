# @package _global_
# CoSpaDi paper configuration for Qwen/Qwen3-0.6B, CR=0.3.
# Requires precomputed X^T X calibration statistics under calib_root.
defaults:
  - override /method: ksvd_deployable
  - override /model: qwen3_06b
  - override /evaluation: quant14

compression_ratio: 0.3
calib_root: ${oc.env:COSPADI_CALIB_ROOT,${repo_root}/calibration}/Qwen/Qwen3-0.6B
method:
  iterations: 60
  power_iterations: 8
  ks_ratio: 2.0
stages:
  collect: false
  compress: true
  evaluate: true
  report: true
